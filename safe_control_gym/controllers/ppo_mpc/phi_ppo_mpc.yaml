
## Currently stale (I think), everything of importance is overwritten. 

phi_path: "MUST_BE_OVERRIDDEN"
phi_bias_path: null
t_ini: 20
y_indices: [0, 2, 4]
theta_max: 0.3
theta_index_in_y: 2

# === NEURAL-NETWORK MODEL ARGS ===
# hidden_dim, activation : critic network architecture.
# norm_obs, norm_reward  : observation / reward normalisation.
hidden_dim: 64
activation: "tanh"
norm_obs: False
norm_reward: False
clip_obs: 10
clip_reward: 10

# === ACTOR CONFIG ===
# qy_mpc   : initial output (y) cost weights Qy, one per y component.
#            Must have the same length as y_indices.
# r_mpc    : initial input cost weights R, one per input channel.
# terminal_weight_scale : multiplier on the terminal step cost (in theta).
#
# mpc_config:
#   horizon : prediction horizon in timesteps.
#   w_sigma : penalty weight on soft constraint slack variables sigma.
actor_config:
  qy_mpc: [5.0, 5.0, 0.1]          # Qy weights for [x, z, theta]
  r_mpc: [0.1, 0.1]                 # R weights for [thrust1, thrust2]
  terminal_weight_scale: 10.0       # Scale of terminal cost (goes into theta)
  mpc_config:
    horizon: 40
    w_sigma: 1000.0                  # Penalty for soft theta constraint violation

# === PPO LOSS ARGS ===
gamma: 0.99
use_gae: False
gae_lambda: 0.95
use_clipped_value: False
clip_param: 0.2
target_kl: 0.01
entropy_coef: 0.01
exploration_init: -1.0

# === OPTIMISER ARGS ===
opt_epochs: 10
mini_batch_size: 64
actor_lr: 0.001
critic_lr: 0.001
max_grad_norm: 0.5

# === RUNNER ARGS ===
max_env_steps: 1000000
num_workers: 1
rollout_batch_size: 4
rollout_steps: 100
deque_size: 10
eval_batch_size: 10

# === MISC ===
log_interval: 0
save_interval: 0
num_checkpoints: 0
eval_interval: 0
eval_save_best: False
tensorboard: False
