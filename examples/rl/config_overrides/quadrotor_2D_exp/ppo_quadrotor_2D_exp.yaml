algo_config:
  # model args
  hidden_dim: 256
  activation: "relu"

  # loss args
  gamma: 0.95
  use_gae: True
  gae_lambda: 0.95
  clip_param: 0.2
  target_kl: 0.01
  entropy_coef: 0.001

  # optim args
  opt_epochs: 20
  mini_batch_size: 256
  actor_lr: 0.0003
  critic_lr: 0.0003

  # runner args
  max_env_steps: 660000
  rollout_batch_size: 10
  rollout_steps: 330
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 6600
  save_interval: 660000
  num_checkpoints: 0
  eval_interval: 6600
  eval_save_best: True
  tensorboard: True
