algo_config:
  # model args
  hidden_dim: 128
  activation: "relu"

  # loss args
  gamma: 0.95
  use_gae: True
  gae_lambda: 0.95
  clip_param: 0.2
  target_kl: 0.01
  entropy_coef: 0.001

  # optim args
  opt_epochs: 10
  mini_batch_size: 256
  actor_lr: 0.0003
  critic_lr: 0.0003

  # runner args
  max_env_steps: 720000
  rollout_batch_size: 20
  rollout_steps: 180
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 7200
  save_interval: 720000
  num_checkpoints: 0
  eval_interval: 7200
  eval_save_best: True
  tensorboard: True
