algo_config:
  # model args
  hidden_dim: 128
  activation: "relu"

  # optim args
  gamma: 0.95
  train_interval: 200
  train_batch_size: 256
  actor_lr: 0.0003
  critic_lr: 0.0003

  # runner args
  max_env_steps: 720000
  warm_up_steps: 3000
  rollout_batch_size: 20
  max_buffer_size: 144000
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 7200
  save_interval: 720000
  num_checkpoints: 0
  eval_interval: 7200
  eval_save_best: True
  tensorboard: True
