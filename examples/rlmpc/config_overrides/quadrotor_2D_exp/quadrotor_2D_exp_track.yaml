task_config:
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_2d
  quad_type: 4
  normalized_rl_action_space: False

  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1.0
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
  randomized_init: False
  init_state_randomization_info:
    init_x:
      distrib: 'normal'
      scale: 0.0011629923113331312
    init_x_dot:
      distrib: 'normal'
      scale: 0.003635597781389117
    init_z:
      distrib: 'normal'
      scale: 0.0024990695232428458
    init_z_dot:
      distrib: 'normal'
      scale: 0.0010193088084183025
    init_theta:
      distrib: 'normal'
      scale: 0.0024088251667187467
    init_theta_dot:
      distrib: 'normal'
      scale: 0.002387283406599296

  randomized_inertial_prop: False
  inertial_prop_randomization_info:
    beta_1: # Nominal: 17.7903
      distrib: 'normal'
      scale: 0.212
    beta_2: # Nominal: 4.2209
      distrib: 'normal'
      scale: 0.071
    alpha_1: # Nominal: -149.740766
      distrib: 'normal'
      scale: 4.609533
    alpha_2: # Nominal: -16.755920
      distrib: 'normal'
      scale: 0.440198
    alpha_3: # Nominal: 129.041538
      distrib: 'normal'
      scale: 5.823345

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 1
    trajectory_plane: 'xz'
    trajectory_position_offset: [0, 1.]
    trajectory_scale: 1.0

  inertial_prop:
    M: 0.033
    Iyy: 1.4e-05
    beta_1: 17.7903
    beta_2: 4.2209
    beta_3: 0.0
    alpha_1: -149.740766
    alpha_2: -16.755920
    alpha_3: 129.041538
    pitch_bias: 0.0 # in radian

  episode_len_sec: 6
  cost: rl_reward
  obs_goal_horizon: 10

  # RL Reward
  rew_state_weight: [10., .1, 10., .1, .1, 0.001]
  rew_act_weight: [.1, .1]
  rew_exponential: True

  disturbances:
    action:
      - disturbance_func: white_noise
        std: [0.003116, 0.003450]
    observation:
      - disturbance_func: white_noise
        std: [1.05e-5, 4.38e-4, 1.29e-5, 5.37e-4, 1.13e-3, 4.34e-2]

  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input

  done_on_out_of_bound: True
  done_on_violation: False
